<!DOCTYPE html><html lang=zh-CN><head>
<meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0">
<title>我的防线 🛡️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1a1a2e;color:#eee;font-family:sans-serif;display:flex;justify-content:center;min-height:100dvh;overflow:hidden}
#app{width:420px;max-width:100vw;height:100dvh;max-height:100dvh;background:#16213e;display:flex;flex-direction:column;position:relative;margin:0 auto}
.tp{display:flex;justify-content:space-between;padding:8px 12px;background:#0f3460;font-size:13px}
.tp .s{display:flex;align-items:center;gap:3px}.tp .s .v{color:#ffd700;font-weight:bold}
.hp{height:5px;background:#222;margin:0 12px 2px;border-radius:3px}
.hp .f{height:100%;background:linear-gradient(90deg,#e74c3c,#f39c12);border-radius:3px;transition:width .2s}
.fw{flex:1;display:flex;align-items:center;justify-content:center;padding:6px;position:relative;overflow:hidden}
#fd{display:grid;gap:5px;width:100%;max-width:400px}
.cl{background:#1a2744;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;border:2px solid transparent;transition:all .06s;aspect-ratio:1}
.cl:active{transform:scale(.85)}
.cl.t{background:#2a1a3d}.cl.l1{border-color:#9b59b6}.cl.l2{border-color:#f39c12}.cl.l3{border-color:#e74c3c}.cl.l4{border-color:#ff4500;box-shadow:0 0 12px #ff4500aa}
.cl.e{border-color:#e74c3c;background:#3a1a1a}.cl.s{border-color:#ffd700!important;box-shadow:0 0 10px #ffd700aa}
.cl .e{font-size:20px}.cl .l{position:absolute;top:1px;right:2px;font-size:7px;color:#aaa}
.cl .eh{position:absolute;bottom:2px;left:2px;right:2px;height:3px;background:#333;border-radius:2px}
.cl .eh .ef{height:100%;background:#e74c3c;transition:width .1s}
.bt{background:#0f3460;padding:6px 8px 10px}
.tb{display:flex;gap:5px;overflow-x:auto;padding:3px 0 5px;min-height:44px;touch-action:pan-x;scrollbar-width:none}
.tc{background:#1a2744;border:2px solid #555;border-radius:8px;padding:4px 8px;text-align:center;font-size:11px;cursor:pointer;flex-shrink:0;min-width:62px;transition:all .1s}
.tc:active{transform:scale(.9)}.tc.lk{opacity:.35;filter:grayscale(.7)}.tc.hl{border-color:#ffd700;background:#2a1f3d}
.br{display:flex;gap:6px;margin-top:4px;min-height:36px}
.br .b{flex:1;padding:7px;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:bold;transition:all .06s;min-height:36px}
.br .b:active{transform:scale(.92)}
.br .g{background:#27ae60;color:#fff}.br .g:disabled{opacity:.4;cursor:default}
.br .p{background:#8e44ad;color:#fff}.br .r{background:#e74c3c;color:#fff}
.br .y{background:#f39c12;color:#000}.br .c{background:#555;color:#fff}
.nt{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);padding:10px 24px;border-radius:12px;font-size:16px;z-index:60;pointer-events:none;opacity:0;transition:.25s;text-align:center;max-width:280px}
.nt.s{opacity:1}
.wt{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);z-index:50;font-size:30px;font-weight:bold;color:#ffd700;text-shadow:0 0 20px #ffd70088;opacity:0;transition:.4s;pointer-events:none}
.wt.s{opacity:1}
.ol{position:absolute;inset:0;background:rgba(0,0,0,.8);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:16px}
.ol h2{font-size:28px;color:#ffd700}.ol p{font-size:15px;color:#ccc;text-align:center;line-height:1.8;max-width:300px}
</style></head><body><div id=app>
<div class=tp><div class=s>❤️ <span class=v id=_h>100</span></div><div class=s>💰 <span class=v id=_g>80</span></div><div class=s>🌊 <span class=v id=_w>0</span></div><div class=s>⚡ <span class=v id=_s>0</span></div></div>
<div class=hp><div class=f id=_hp style=width:100%></div></div>
<div class=fw><div id=_fd></div><div class=wt id=_wt>🌊 第1波</div><div class=nt id=_nt></div></div>
<div class=bt><div class=tb id=_tb></div><div class=br id=_br></div></div>
<div class=ol id=_ol><h2>💀 防线崩溃</h2><p id=_ot></p><button class="b g" onclick=Re()>🔄 重来</button></div>
</div>

<script>
// ============ CONFIG ============
const N=6;
const TW=[
  {e:'🔫',n:'机枪',c:20,a:[8,18,38,78],r:2.2,t:[12,9,6,4],u:0},
  {e:'💣',n:'火炮',c:35,a:[20,42,88,178],r:2.5,t:[18,14,10,8],u:0},
  {e:'🔦',n:'激光',c:55,a:[14,30,62,126],r:3.5,t:[8,6,4,3],u:150},
  {e:'❄️',n:'冰霜',c:45,a:[10,22,46,94],r:3.0,t:[14,10,7,5],u:100},
];

// ============ STATE ============
// phase: 'idle' | 'battle' | 'dead'
let g;
function fresh(){
  g={
    grid:Array(N*N).fill(null),
    gold:80,hp:100,mx:100,wave:0,score:0,
    enemies:[],phase:'idle',speed:1,
    hand:-1,sel:-1,tick:0,
    unlocked:[true,true,false,false],
    q:[],spawned:0,total:0,
  };
}

// ============ DOM ============
let _h,_g,_w,_s,_hp,_fd,_tb,_br,_nt,_wt,_ol,_ot;
function dom(){
  _h=document.getElementById('_h');_g=document.getElementById('_g');
  _w=document.getElementById('_w');_s=document.getElementById('_s');
  _hp=document.getElementById('_hp');_fd=document.getElementById('_fd');
  _tb=document.getElementById('_tb');_br=document.getElementById('_br');
  _nt=document.getElementById('_nt');_wt=document.getElementById('_wt');
  _ol=document.getElementById('_ol');_ot=document.getElementById('_ot');
}

// ============ RENDER ============
function render(){
  if(!_fd)return;
  _fd.style.gridTemplateColumns=`repeat(${N},1fr)`;
  _fd.innerHTML='';
  for(let i=0;i<N*N;i++){
    let el=document.createElement('div');el.className='cl';el._i=i;
    el.onclick=()=>clickCell(i);
    _fd.appendChild(el);
  }
  sync();
  buildTowers();
  buildBtns();
  stats();
}

function sync(){
  for(let i=0;i<N*N;i++){
    let el=_fd.children[i];if(!el)continue;
    let t=g.grid[i],e=g.enemies.find(x=>x.i===i);
    el.className='cl';el.innerHTML='';
    if(t){el.classList.add('t',`l${t.l}`);el.innerHTML=`<span class=e>${TW[t.id].e}</span><span class=l>${t.l}</span>`}
    if(e){
      el.classList.add('e');
      if(!t)el.innerHTML=`<span class=e>👾</span>`;
      el.innerHTML+=`<div class=eh><div class=ef style=width:${Math.round(e.h/e.m*100)}%></div></div>`;
    }
    if(i===g.sel&&t)el.classList.add('s');
  }
}

function buildTowers(){
  _tb.innerHTML='';
  TW.forEach((t,i)=>{
    let d=document.createElement('div');
    d.className=`tc${g.unlocked[i]?'':' lk'}${g.hand===i?' hl':''}`;
    d.innerHTML=`<div>${t.e} ${t.n}</div><div>💰${g.unlocked[i]?t.c:'🔒'+t.u}</div>`;
    d.onclick=()=>towerClick(i);
    _tb.appendChild(d);
  });
}

function towerClick(i){
  if(g.phase==='battle'){msg('⛔ 战斗中');return}
  let t=TW[i];
  if(!g.unlocked[i]){
    if(g.gold>=t.u){g.gold-=t.u;g.unlocked[i]=true;buildTowers();stats();towerClick(i);return}
    msg(`💰 需要${t.u}金`);return
  }
  if(g.hand===i){g.hand=-1;g.sel=-1;render();return}
  if(g.gold<t.c){msg(`💰 需要${t.c}金`);return}
  g.hand=i;g.sel=-1;render();msg(`👆 点格子放${t.n}`,500);
}

function clickCell(i){
  if(g.phase==='battle'){msg('⛔ 战斗中');return}
  if(g.hand>=0){
    if(g.grid[i]){msg('❌ 有炮塔了');return}
    let t=TW[g.hand];
    if(g.gold<t.c){msg('💰 不够');return}
    g.gold-=t.c;g.grid[i]={id:g.hand,l:1};g.hand=-1;
    render();merge();msg(`✅ ${t.e}`,400);return
  }
  if(g.grid[i]){g.sel=g.sel===i?-1:i;render();return}
  g.sel=-1;render();
}

function merge(){
  for(let t=0;t<50;t++){
    let ok=false;
    for(let i=0;i<g.grid.length;i++){
      let a=g.grid[i];if(!a||a.l>=4)continue;
      for(let j of nbrs(i)){
        let b=g.grid[j];
        if(b&&b.id===a.id&&b.l===a.l){
          g.grid[i]={id:a.id,l:a.l+1};g.grid[j]=null;
          g.gold+=a.l*6+10;
          msg(`⬆️ ${TW[a.id].e}Lv.${a.l+1}`,500);
          render();ok=true;break;
        }
      }
      if(ok)break;
    }
    if(!ok)break;
  }
}

function nbrs(i){let r=i/N|0,c=i%N,a=[];if(r>0)a.push(i-N);if(r<N-1)a.push(i+N);if(c>0)a.push(i-1);if(c<N-1)a.push(i+1);return a}

function buildBtns(){
  _br.innerHTML='';
  if(g.sel>=0&&g.grid[g.sel]){
    let t=TW[g.grid[g.sel].id],l=g.grid[g.sel].l,cost=Math.floor(t.c*Math.pow(1.8,l-1)),ok=l<4&&g.gold>=cost;
    let b1=document.createElement('button');b1.className='b y';b1.textContent=`⬆️ 💰${cost}`;b1.disabled=!ok;
    b1.onclick=()=>{
      let c=g.grid[g.sel];if(!c||c.l>=4)return;
      let co=Math.floor(TW[c.id].c*Math.pow(1.8,c.l-1));if(g.gold<co)return;
      g.gold-=co;c.l++;render();msg(`⬆️ Lv.${c.l}`);
    };
    _br.appendChild(b1);
    let b2=document.createElement('button');b2.className='b r';b2.textContent='💰卖';
    b2.onclick=()=>{
      let c=g.grid[g.sel];if(!c)return;
      g.gold+=Math.floor(TW[c.id].c*Math.pow(1.8,c.l-1)*0.5);
      g.grid[g.sel]=null;g.sel=-1;render();msg('💰卖了');
    };
    _br.appendChild(b2);
    let b3=document.createElement('button');b3.className='b c';b3.textContent='✕';
    b3.onclick=()=>{g.sel=-1;render()};
    _br.appendChild(b3);
    return;
  }
  let txt=g.wave===0?'▶ 第1波':`▶ 第${g.wave+1}波`;
  if(g.phase==='battle')txt='⚔️ 战斗中';
  let bw=document.createElement('button');bw.className='b g';bw.textContent=txt;bw.disabled=g.phase==='battle';
  bw.onclick=()=>go();
  _br.appendChild(bw);
  let bs=document.createElement('button');bs.className='b p';bs.textContent=`⏩ ${g.speed}x`;
  bs.onclick=()=>{g.speed=g.speed===1?3:1;bs.textContent=`⏩ ${g.speed}x`};
  _br.appendChild(bs);
}

function stats(){
  _h.textContent=g.hp;_g.textContent=g.gold;_w.textContent=g.wave;_s.textContent=g.score;
  _hp.style.width=(g.hp/g.mx*100)+'%';
}

// ============ BATTLE ============
function go(){
  if(g.phase==='battle'||g.hp<=0)return;
  g.wave++;g.phase='battle';g.enemies=[];g.tick=0;g.spawned=0;
  g.total=Math.min(4+Math.floor(g.wave*1.8),30);
  g.q=[];
  for(let i=0;i<g.total;i++)g.q.push(15+Math.floor(i*(40/Math.max(1,g.wave)))+Math.floor(Math.random()*8));
  _wt.textContent=`🌊 第${g.wave}波`;_wt.classList.add('s');setTimeout(()=>_wt.classList.remove('s'),1300);
  render();msg(`🌊 第${g.wave}波 ${g.total}只`,1000);
}

function eSpawn(){
  let e=[];
  for(let i=0;i<N;i++){if(!g.grid[i])e.push(i);if(!g.grid[N*(N-1)+i])e.push(N*(N-1)+i)}
  for(let r=0;r<N;r++){if(!g.grid[r*N])e.push(r*N);if(!g.grid[r*N+N-1])e.push(r*N+N-1)}
  let u=[...new Set(e)];if(!u.length)return;
  let i=u[Math.random()*u.length|0],h=16+(Math.random()*10|0)+(g.wave*3|0);
  g.enemies.push({i,h,m:h});g.spawned++;
}

function loop(){
  if(g.hp<=0){
    g.phase='dead';
    _ol.style.display='flex';
    _ot.innerHTML=`守住 ${g.wave} 波<br>🏆 ${g.score}分<br>💰 ${g.gold}金`;
    setTimeout(loop,100);
    return;
  }
  for(let s=0;s<g.speed;s++){
    g.tick++;
    if(g.phase!=='battle')continue;
    // Spawn
    while(g.q.length&&g.tick>=g.q[0]){g.q.shift();eSpawn()}
    // Towers attack
    for(let i=0;i<g.grid.length;i++){
      let tw=g.grid[i];if(!tw)continue;
      let td=TW[tw.id];if(!td)continue;
      if(g.tick%td.t[tw.l-1]!==0)continue;
      let bi=-1,bd=999;
      for(let j=0;j<g.enemies.length;j++){
        let d=dist(i,g.enemies[j].i);
        if(d<=td.r&&d<bd){bi=j;bd=d}
      }
      if(bi<0)continue;
      let e=g.enemies[bi];e.h-=td.a[tw.l-1];
      if(e.h<=0){
        g.gold+=2+(Math.random()*4|0)+(g.wave*0.4|0);
        g.score+=2+(g.wave*0.4|0);
        g.enemies.splice(bi,1);
      }
    }
    // Enemy movement (every 8 ticks)
    if(g.tick%8===0){
      for(let ei=g.enemies.length-1;ei>=0;ei--){
        let e=g.enemies[ei],ns=nbrs(e.i);
        // If on tower cell, attack + move
        if(g.grid[e.i]){
          let tw=g.grid[e.i];
          if(tw.l>1){tw.l--}else{g.grid[e.i]=null}
          let em=ns.filter(n=>!g.grid[n]);
          if(em.length)e.i=em[Math.random()*em.length|0];
          continue;
        }
        // Move towards nearest tower or center
        let tn=ns.filter(n=>g.grid[n]);
        let target=null;
        if(tn.length){target=tn[Math.random()*tn.length|0]}
        else{
          let bd=999,sh=[...ns].sort(()=>Math.random()-.5);
          for(let n of sh){if(g.grid[n])continue;let d=dist(n,N*N>>1);if(d<bd){bd=d;target=n}}
        }
        if(target!==null)e.i=target;
        // Damage player on edge
        let r=e.i/N|0,c=e.i%N;
        if((r===0||r===N-1||c===0||c===N-1)&&!g.grid[e.i]&&Math.random()<.1+g.wave*.02){
          g.hp=Math.max(0,g.hp-(2+(g.wave*0.5|0)));
          if(g.hp<=0)break;
        }
      }
      if(g.hp<=0)break;
    }
    // End wave
    if(!g.q.length&&!g.enemies.length&&g.phase==='battle'){
      g.phase='idle';
      g.gold+=15+g.wave*6;
      msg(`🎉 第${g.wave}波守住💰+${15+g.wave*6}`,1200);
      g.hand=-1;g.sel=-1;
    }
  }
  if(g.phase==='battle'||g.phase==='idle'){sync();stats()}
  setTimeout(loop,100);
}

function dist(a,b){return Math.hypot((a/N|0)-(b/N|0),a%N-b%N)}

let nt_;function msg(t,d){_nt.textContent=t;_nt.classList.add('s');clearTimeout(nt_);nt_=setTimeout(()=>_nt.classList.remove('s'),d||800)}

function Re(){fresh();render()}

// ============ BOOT ============
dom();fresh();render();loop();
console.log('防线 v6 - phase:',g.phase);
</script></body></html>

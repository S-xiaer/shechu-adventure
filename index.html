<!DOCTYPE html>
<html lang=zh-CN>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1.0">
<title>社畜蛇蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Microsoft YaHei',sans-serif;display:flex;justify-content:center;min-height:100vh}
#g{max-width:600px;width:100%;padding:12px;display:flex;flex-direction:column;gap:8px}
#h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#16213e;border-radius:10px;border:1px solid #e9456033}
#h h1{font-size:16px;color:#e94560}
.sc{padding:3px 8px;border-radius:6px;font-size:12px;background:rgba(255,255,255,.06)}
.sc.s{color:#ffd700}.sc.h{color:#4ecca3}.sc.l{color:#ff6b9d}
#cv{display:flex;justify-content:center;background:#16213e;border-radius:10px;padding:8px;border:1px solid rgba(255,255,255,.06)}
canvas{background:#0f0f23;border-radius:6px;width:100%;max-width:480px;height:auto;aspect-ratio:1}
#ui{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn{background:#0f3460;color:#e0e0e0;border:none;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{background:#e94560;color:#fff}
.btn.sm{padding:5px 10px;font-size:11px}
#st{background:#16213e;border-radius:10px;padding:10px 14px;border:1px solid rgba(255,255,255,.06);font-size:13px;line-height:1.6;min-height:40px;color:#c0c0c0;text-align:center}
#st .em{color:#ff6b9d;font-weight:bold}
#st .gl{color:#4ecca3;font-weight:bold}
#st .rd{color:#e94560}
#skin-panel{display:none;flex-wrap:wrap;gap:8px;justify-content:center;background:#16213e;border-radius:10px;padding:12px;border:1px solid rgba(255,255,255,.06)}
.skin-opt{width:50px;height:50px;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:all .2s;position:relative}
.skin-opt:hover{border-color:#e94560;transform:scale(1.1)}
.skin-opt.sel{border-color:#ffd700;box-shadow:0 0 12px #ffd70066}
.skin-opt .nm{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:9px;white-space:nowrap;color:#888}
</style>
</head>
<body>
<div id=g>
  <div id=h>
    <h1>🐍 社畜蛇蛇</h1>
    <div>
      <span class="sc s">💰<span id=sc>0</span></span>
      <span class="sc l">💕<span id=lc>0</span></span>
    </div>
  </div>
  <div id=cv><canvas id=can width=400 height=400></canvas></div>
  <div id=ui>
    <button class=btn onclick=st()>开始</button>
    <button class="btn sm" onclick=ps()>暂停/继续</button>
    <button class="btn sm" onclick=ts()>🎨 换皮肤</button>
  </div>
  <div id=st>点击「开始」开始游戏<br>方向键控制蛇移动，吃到 💰 加分，💕 触发剧情</div>
  <div id=skin-panel>
    <div class="skin-opt sel" onclick="sk(0)"><div style="width:100%;height:100%;border-radius:6px;background:linear-gradient(135deg,#4ecca3,#38a87e)"></div><div class=nm>青蛇</div></div>
    <div class="skin-opt" onclick="sk(1)"><div style="width:100%;height:100%;border-radius:6px;background:linear-gradient(135deg,#e94560,#c23151)"></div><div class=nm>赤蛇</div></div>
    <div class="skin-opt" onclick="sk(2)"><div style="width:100%;height:100%;border-radius:6px;background:linear-gradient(135deg,#ffd700,#e6b800)"></div><div class=nm>金蛇</div></div>
    <div class="skin-opt" onclick="sk(3)"><div style="width:100%;height:100%;border-radius:6px;background:linear-gradient(135deg,#a855f7,#7c3aed)"></div><div class=nm>紫蛇</div></div>
    <div class="skin-opt" onclick="sk(4)"><div style="width:100%;height:100%;border-radius:6px;background:linear-gradient(135deg,#ff69b4,#db2777)"></div><div class=nm>粉蛇</div></div>
    <div class="skin-opt" onclick="sk(5)"><div style="width:100%;height:100%;border-radius:6px;background:linear-gradient(135deg,#06b6d4,#0891b2)"></div><div class=nm>蓝蛇</div></div>
    <div class="skin-opt" onclick="sk(6)"><div style="width:100%;height:100%;border-radius:6px;background:repeating-linear-gradient(45deg,#e94560,#e94560 4px,#ffd700 4px,#ffd700 8px)"></div><div class=nm>斑马</div></div>
    <div class="skin-opt" onclick="sk(7)"><div style="width:100%;height:100%;border-radius:6px;background:linear-gradient(135deg,#fff,#ccc);position:relative;overflow:hidden"><div style="position:absolute;top:5px;left:5px;font-size:20px;opacity:.3">👻</div></div><div class=nm>幽灵</div></div>
  </div>
</div>

<script>
// ====== Game State ======
var C,ctx,SZ=20,cols=20,rows=20;
var snake=[],dir={x:0,y:0},nextDir={x:0,y:0},food={x:5,y:5},foodType="money";
var running=false,paused=false,score=0,love=0;
var skin=0,timer=null,speed=200,spdBase=200;
var skins=[
  {h:"#4ecca3",b:"#38a87e",e:"#2d8f68",h2:"#3bbd93"},
  {h:"#e94560",b:"#c23151",e:"#a62944",h2:"#db3b57"},
  {h:"#ffd700",b:"#e6b800",e:"#cca000",h2:"#f0cc00"},
  {h:"#a855f7",b:"#7c3aed",e:"#6d28d9",h2:"#9333ea"},
  {h:"#ff69b4",b:"#db2777",e:"#be1d6a",h2:"#ec4899"},
  {h:"#06b6d4",b:"#0891b2",e:"#0e7490",h2:"#22d3ee"},
  {h:"#e94560",b:"#ffd700",e:"#fff",h2:"#ffd700"},
  {h:"rgba(200,200,220,.2)",b:"rgba(200,200,220,.1)",e:"rgba(255,255,255,.6)",h2:"rgba(200,200,220,.2)"}
];
var evtPool=[
  {t:"林小雅对你眨了眨眼：晚上来我家吃饭？",l:5},
  {t:"周雨桐偷偷塞了张纸条给你：周末有空？",l:5},
  {t:"阿强神秘地递给你一张票：楼上有特殊表演。",l:3},
  {t:"你梦到了不该梦到的人……脸红了。",l:4},
  {t:"林小雅穿着睡衣来敲门借WiFi。信号不好？",l:6},
  {t:"同事偷拍了一张boss的丑照发群里。",l:2},
  {t:"突然下雨，你跟一个陌生人共撑一把伞。",l:3},
  {t:"楼下便利店收银员多找了你十块钱。",l:2},
  {t:"电梯里只有你和林小雅。她今天喷了新的香水。",l:5},
  {t:"周雨桐发了一条仅你可见的朋友圈。",l:6},
  {t:"你在深夜刷到了前任的微博——好像过得不太好。你暗自爽了一下。",l:1},
  {t:"楼上传来了洗澡的水声。你脑海中闪过了一些画面。",l:4},
  {t:"林小雅练舞的视频不小心发到了朋友圈。你反复看了三遍。",l:6},
  {t:"深夜你听到了隔壁的哭声。犹豫再三还是没敢敲门。",l:3},
  {t:"同事聚餐时，大家起哄让你和周雨桐喝交杯酒。",l:7}
];

// ====== Init ======
function init(){
  ctx=document.getElementById("can").getContext("2d");
  C=document.getElementById("can");
  reset();
}
function reset(){
  snake=[{x:Math.floor(cols/2),y:Math.floor(rows/2)}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;love=0;paused=false;
  spdBase=200;speed=200;
  document.getElementById("sc").textContent=0;
  document.getElementById("lc").textContent=0;
  spawnFood();
  draw();
  if(timer){clearInterval(timer);timer=null;}
  running=false;
  setStatus("点击「开始」开始游戏");
}
function st(){
  if(running){reset();}
  reset();
  running=true;
  if(timer)clearInterval(timer);
  speed=spdBase;
  timer=setInterval(tick,speed);
  setStatus("游戏进行中！方向键控制 🐍");
}
function ps(){
  if(!running){st();return;}
  paused=!paused;
  setStatus(paused?"⏸ 暂停中，按继续恢复":"▶ 继续进行");
}
function ts(){
  var p=document.getElementById("skin-panel");
  p.style.display=p.style.display==="none"||p.style.display===""?"flex":"none";
}
function sk(i){
  skin=i;
  document.querySelectorAll(".skin-opt").forEach(function(e,i2){e.classList.toggle("sel",i2===i);});
  document.getElementById("skin-panel").style.display="none";
  draw();
}

function setStatus(t){
  document.getElementById("st").innerHTML=t.replace(/\n/g,"<br>");
}
function spawnFood(){
  var empty=false;
  while(!empty){
    food.x=Math.floor(Math.random()*cols);
    food.y=Math.floor(Math.random()*rows);
    empty=true;
    for(var i=0;i<snake.length;i++){if(snake[i].x===food.x&&snake[i].y===food.y){empty=false;break;}}
  }
  foodType=Math.random()>0.35?"money":"love";
}

// ====== Tick ======
function tick(){
  if(paused)return;
  dir={x:nextDir.x,y:nextDir.y};
  var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  // wall wrap
  if(head.x<0)head.x=cols-1;
  if(head.x>=cols)head.x=0;
  if(head.y<0)head.y=rows-1;
  if(head.y>=rows)head.y=0;
  // self collision
  for(var i=0;i<snake.length;i++){
    if(snake[i].x===head.x&&snake[i].y===head.y){
      gameOver();return;
    }
  }
  snake.unshift({x:head.x,y:head.y});
  var ate=false;
  if(head.x===food.x&&head.y===food.y){
    ate=true;
    if(foodType==="money"){
      score+=10;
      document.getElementById("sc").textContent=score;
      if(score%50===0&&speed>80){speed=Math.max(80,speed-10);clearInterval(timer);timer=setInterval(tick,speed);}
    }else{
      love+=3;
      document.getElementById("lc").textContent=love;
      var evt=pk(evtPool);
      love+=evt.l;
      setStatus("💕 剧情触发！<br><span class=em>"+evt.t+"</span><br>桃花 +"+evt.l);
      document.getElementById("lc").textContent=love;
      setTimeout(function(){
        if(running)setStatus("继续游戏 🐍");
      },2500);
    }
    spawnFood();
  }
  if(!ate)snake.pop();
  draw();
}
function pk(a){return a[Math.floor(Math.random()*a.length)]}

function gameOver(){
  running=false;
  if(timer){clearInterval(timer);timer=null;}
  var msg="";
  if(score>200)msg="<span class=gl>恭喜发财！</span>";
  if(love>20)msg+=" <span class=em>桃花运爆棚！</span>";
  setStatus("💀 蛇蛇撞到了自己！<br>得分: <span class=gl>"+score+"</span> | 桃花: <span class=em>"+love+"</span><br>"+msg+"<br>点击「开始」再来一局");
  draw();
}

// ====== Draw ======
function draw(){
  ctx.clearRect(0,0,400,400);
  var sk=skins[skin];
  // Grid
  ctx.strokeStyle="rgba(255,255,255,.03)";
  ctx.lineWidth=0.5;
  for(var i=0;i<=cols;i++){ctx.beginPath();ctx.moveTo(i*20,0);ctx.lineTo(i*20,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*20);ctx.lineTo(400,i*20);ctx.stroke();}
  // Snake
  for(var i=0;i<snake.length;i++){
    var x=snake[i].x*SZ,y=snake[i].y*SZ,r=SZ-2;
    if(i===0){
      ctx.fillStyle=sk.h;ctx.shadowColor=sk.h;ctx.shadowBlur=8;
      ctx.beginPath();ctx.roundRect(x+1,y+1,r,r,[3,3,6,6]);ctx.fill();
      ctx.shadowBlur=0;
      // Eyes
      var ed=4,ex,ey;
      if(dir.x===1){ex=x+12;ey=y+5;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ex,ey,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ex,y+12,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(ex+1,ey,1.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ex+1,y+12,1.2,0,Math.PI*2);ctx.fill();}
      if(dir.x===-1){ex=x+5;ey=y+5;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ex,ey,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ex,y+12,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(ex-1,ey,1.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ex-1,y+12,1.2,0,Math.PI*2);ctx.fill();}
      if(dir.y===1){ex=x+5;ey=y+12;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ex,ey,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+12,ey,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(ex,ey+1,1.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+12,ey+1,1.2,0,Math.PI*2);ctx.fill();}
      if(dir.y===-1){ex=x+5;ey=y+5;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ex,ey,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+12,ey,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(ex,ey-1,1.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+12,ey-1,1.2,0,Math.PI*2);ctx.fill();}
    }else{
      var t=i/snake.length;
      ctx.fillStyle=sk.b;ctx.globalAlpha=1-t*0.5;
      ctx.beginPath();ctx.roundRect(x+1,y+1,r,r,2);ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  // Food
  var fx=food.x*SZ+1,fy=food.y*SZ+1;
  if(foodType==="money"){
    ctx.fillStyle="#ffd700";ctx.shadowColor="#ffd700";ctx.shadowBlur=12;
    ctx.font="28px serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("💰",fx+10,fy+11);
  }else{
    ctx.fillStyle="#ff6b9d";ctx.shadowColor="#ff6b9d";ctx.shadowBlur=12;
    ctx.font="26px serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("💕",fx+10,fy+10);
  }
  ctx.shadowBlur=0;
}
// roundRect polyfill
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==="number")r=[r,r,r,r];
    this.moveTo(x+r[0],y);this.lineTo(x+w-r[1],y);this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
    this.lineTo(x+w,y+h-r[2]);this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
    this.lineTo(x+r[3],y+h);this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
    this.lineTo(x,y+r[0]);this.quadraticCurveTo(x,y,x+r[0],y);
    this.closePath();return this;
  };
}

// ====== Controls ======
document.addEventListener("keydown",function(e){
  switch(e.key){
    case"ArrowUp":if(dir.y!==1){nextDir={x:0,y:-1}}e.preventDefault();break;
    case"ArrowDown":if(dir.y!==-1){nextDir={x:0,y:1}}e.preventDefault();break;
    case"ArrowLeft":if(dir.x!==1){nextDir={x:-1,y:0}}e.preventDefault();break;
    case"ArrowRight":if(dir.x!==-1){nextDir={x:1,y:0}}e.preventDefault();break;
    case" ":{e.preventDefault();if(!running)st();else ps();}break;
  }
});
// Touch controls for mobile
var tx,ty;
document.getElementById("can").addEventListener("touchstart",function(e){var t=e.touches[0];tx=t.clientX;ty=t.clientY;});
document.getElementById("can").addEventListener("touchend",function(e){
  if(!tx||!ty)return;
  var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&dir.x!==-1)nextDir={x:1,y:0};else if(dx<0&&dir.x!==1)nextDir={x:-1,y:0};}
  else{if(dy>0&&dir.y!==-1)nextDir={x:0,y:1};else if(dy<0&&dir.y!==1)nextDir={x:0,y:-1};}
});

init();
</script>
</body>
</html>

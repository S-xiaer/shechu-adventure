<!DOCTYPE html>
<html lang=zh-CN>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1.0">
<title>社畜生活 v3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;display:flex;justify-content:center}
#game{width:100%;max-width:720px;min-height:100vh;display:flex;flex-direction:column;background:#16213e;box-shadow:0 0 40px rgba(0,0,0,.5)}
#hd{background:linear-gradient(135deg,#0f3460,#1a1a2e);padding:12px 16px;border-bottom:2px solid #e94560;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
#hd h1{font-size:16px;color:#e94560}
#st{display:flex;gap:8px;font-size:11px}
.st{padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.08)}
.st.m{color:#ffd700}.st.h{color:#4ecca3}.st.l{color:#ff6b9d}
#sc{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.img{text-align:center;font-size:48px;margin:4px 0}
.tl{font-size:18px;font-weight:bold;color:#fff;text-align:center}
.desc{line-height:1.7;font-size:14px;color:#c0c0c0;white-space:pre-wrap}
#ch{padding:12px 16px;display:flex;flex-direction:column;gap:7px;border-top:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.2)}
.c{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#e0e0e0;padding:11px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:all .2s;text-align:left;font-family:inherit;line-height:1.4}
.c:hover{background:rgba(233,69,96,.15);border-color:#e94560;transform:translateX(3px)}
.c .k{display:inline-block;background:rgba(255,255,255,.1);padding:0 6px;border-radius:3px;margin-right:7px;font-size:11px;color:#888}
#lg{padding:8px 16px;font-size:11px;color:#555;border-top:1px solid rgba(255,255,255,.04);max-height:60px;overflow-y:auto;display:none}
#rt{background:transparent;border:1px solid rgba(255,255,255,.15);color:#888;padding:3px 10px;border-radius:5px;font-size:11px;cursor:pointer;transition:all .2s;font-family:inherit}
#rt:hover{border-color:#e94560;color:#e94560}
</style>
</head>
<body>
<div id=game>
<div id=hd>
<h1>社畜生活</h1>
<div id=st>
<span class="st m">💰<span id=m></span></span>
<span class="st h">❤️<span id=h></span></span>
<span class="st l">💕<span id=l></span></span>
</div>
<button id=rt onclick=rst()>↻</button>
</div>
<div id=sc></div>
<div id=ch></div>
<div id=lg></div>
</div>
<script>
// ====== 状态 ======
var D={mon:1000,hp:100,lv:50,sex:"",log:[],fl:{},sc:"",day:1,gs:[]};
function init(){D={mon:1000,hp:100,lv:50,sex:"",log:[],fl:{},sc:"",day:1,gs:[]}}
function up(){
  document.getElementById("m").textContent=D.mon>=10000?(D.mon/10000).toFixed(1)+"w":D.mon;
  document.getElementById("h").textContent=D.hp;document.getElementById("l").textContent=D.lv;
}
function ad(t,ty){D.log.push({t:t,ty:ty})}
function am(a){D.mon+=a;if(a>0)ad("💰+"+a);else ad("💰"+a);if(D.mon<0)D.mon=0}
function ah(a){D.hp+=a;if(a>0)ad("❤️+"+a);else ad("❤️"+a);if(D.hp<0)D.hp=0;if(D.hp>100)D.hp=100}
function al(a){D.lv+=a;if(a>0)ad("💕+"+a);else ad("💕"+a);if(D.lv<0)D.lv=0;if(D.lv>100)D.lv=100}
function pk(a){return a[Math.floor(Math.random()*a.length)]}
function go(i){D.sc=i;rd()}
function rd(){
  var s=document.getElementById("sc"),c=document.getElementById("ch"),l=document.getElementById("lg");
  var sc=sn[D.sc];if(!sc){s.innerHTML="";c.innerHTML="";return}
  if(sc.con&&!sc.con()){go(sc.fb||"start");return}
  var d=typeof sc.d==="function"?sc.d():sc.d;
  var t=typeof sc.t==="function"?sc.t():sc.t;
  var h="";if(sc.im)h+="<div class=img>"+sc.im+"</div>";if(t)h+="<div class=tl>"+t+"</div>";
  if(d)h+="<div class=desc>"+(typeof d==="string"?d.replace(/\n/g,"<br>"):d)+"</div>";s.innerHTML=h;
  if(sc.ci){c.innerHTML=sc.ci.map(function(x,i){
    if(x.con&&!x.con())return"";
    var lb=["❶","❷","❸","❹","❺","❻","❼","❽"][i]||"#"+(i+1);
    return '<button class=c onclick=ch('+i+')><span class=k>'+lb+"</span>"+x.t+"</button>";
  }).join("")}else c.innerHTML="";
  if(D.log.length>0){l.style.display="block";l.innerHTML=D.log.slice(-4).reverse().map(function(x){return'<div>'+x.t+'</div>'}).join("")}
  up();s.scrollTop=0;
}
function ch(i){
  var sc=sn[D.sc];if(!sc||!sc.ci||!sc.ci[i])return;
  var x=sc.ci[i];if(x.e)x.e();if(x.g)go(x.g);
  if(D.hp<=0)setTimeout(function(){go("go")},400);up();
}
function rst(){if(!confirm("重新开始？所有进度消失"))return;init();go("start")}

// ====== 随机内容大池子 ======
// 每天随机生成3个"生活片段"，每次重玩完全重新抽

var EVENTS={
  morning:[
    "今天地铁特别挤，被人群推着走了一路。",
    "早餐摊阿姨说好久没见你了，给你多加了个蛋。",
    "出门就下雨，没带伞。跑到公交站浑身湿了一半。",
    "电梯里遇到一个超帅的小哥哥，心跳了一下。",
    "闹钟没响，差点迟到。脸都没洗就冲出门。",
    "在早餐摊看到林小雅也在买包子，穿着居家服，头发随便扎着。",
    "楼下野猫生了窝小猫，奶声奶气地叫。",
    "手机只剩5%电，充电宝忘带了。",
    "今天太阳特别好，心情莫名不错。"
  ],
  office:[
    "boss又在会议室拍桌子，隔两层楼都听得见。",
    "同事偷偷投屏了B站鬼畜视频，整个部门笑成一片。",
    "新来的实习生帮你泡了杯咖啡，加了颗小心心拉花。",
    "有人在茶水间冰箱里放了一盒切好的水果，附纸条：随便吃。",
    "下午茶时间，行政姐姐叫了奶茶，你被算上了。",
    "boss路过你工位，盯着你屏幕看了三秒。你正在摸鱼。",
    "前台收到了一大束玫瑰，卡片写：第六百三十天。",
    "同事群在传boss年轻时的非主流照片，收获一堆哈哈哈。",
    "空调坏了，办公室又闷又热。技术主管光膀子打代码。",
    "财务大姐在发喜糖——女儿订婚了。全公司沾喜气。"
  ],
  boss:[
    "王扒皮叫你进办公室：这个方案今晚之前给我。",
    "boss今天心情不错，开会时难得没骂人。还讲了个冷笑话。",
    "王扒皮在走廊打电话：老婆我错了……声音很小。",
    "boss发了条朋友圈：又是奋斗的一天。定位却在按摩店。",
    "王扒皮让你帮他取快递，箱子挺沉。你晃了晃，听到瓶瓶罐罐的声音。",
    "今天boss穿了一身亮粉色西装，全公司憋着不敢笑。"
  ],
  afterWork:[
    "下班路上看到一对情侣在吵架，女的把奶茶摔在地上。",
    "地铁上有人弹吉他卖唱，唱的是《成都》。你扫了五块钱。",
    "路边卖烤红薯的大爷说这是今年最后一批了。买了两个。",
    "商场门口在搞活动，扫码送小礼品。你扫码拿到一包纸巾。",
    "在便利店遇到一个超可爱的女生在挑关东煮。",
    "天桥上有人在卖小狗，毛茸茸的冲你摇尾巴。",
    "前面走着一个穿汉服的小姐姐，风吹起来像仙女。",
    "路过健身房，教练递传单：帅哥/美女，健身了解一下？",
    "广场舞大妈换了新曲，比原版还带劲。"
  ],
  night:[
    "洗完澡发现停水了——头发上的泡沫还没冲干净。",
    "点了个外卖，半小时了还没接单。饿得胃痛。",
    "隔壁传来奇怪的声音……你默默戴上耳机。",
    "林小雅发了条朋友圈：失眠。配了一张月亮照片。",
    "刷到一部很好看的擦边网剧，一口气看了四集。",
    "手机推送：你关注的舞蹈区UP主更新了。",
    "房东阿姨发微信：下个月涨租200。",
    "有人在楼下弹吉他，弹的是周杰伦。你靠在窗边听了很久。",
    "电费欠费通知来了，赶紧交了200。"
  ],
  spicy:[
    "正做梦呢，被楼上蹦迪声吵醒。看了看时间——凌晨两点。",
    "在地铁上，对面一个穿JK的妹子一直看你，你看回去她就低头笑。",
    "同事偷偷告诉你：boss昨天在酒店被人拍到了。不是自己老婆。",
    "你在公司电脑上发现了上一个同事留下的隐藏文件夹……",
    "林小雅约你周末去她家吃饭。你心跳加速了一整天。",
    "阿强递给你一本杂志，封面是性感写真。他说这是上一期滞销货。",
    "半夜有人敲错门，打开是个喝醉的女生：对不起走错了……你真好看。",
    "刷到前任的动态——又在秀恩爱。你把她屏蔽了。",
    "体检报告出来了，好几项标红。你决定这周开始养生。",
    "公司群突然有人匿名发了一张照片……群瞬间炸了。"
  ]
};

// 合成每天的生活——从每个事件池抽1条，拼成段子
function dailyLife(){
  var lines=[];
  lines.push("🌅 早晨："+pk(EVENTS.morning));
  lines.push("🏢 办公室："+pk(EVENTS.office));
  lines.push("👔 boss相关："+pk(EVENTS.boss));
  lines.push("🌇 下班路上："+pk(EVENTS.afterWork));
  lines.push("🌙 夜晚："+pk(EVENTS.night));
  // 擦边随机
  if(Math.random()>0.5)lines.push("🔥 意外："+pk(EVENTS.spicy));
  return lines.join("\n");
}

// 随机人物对话
var CHATS={
  colleague:[
    "你听说了吗？技术主管跟产品经理打起来了，因为一个按钮的位置。",
    "中午吃什么？楼下新开了家麻辣烫，去试试？",
    "boss今天穿的那身，我以为是来参加葬礼的。",
    "我昨天看到boss跟一个女的在咖啡厅……那女的不像他老婆。",
    "你最近气色不错，是不是谈恋爱了？",
    "年终奖可能要砍半，财务大姐偷偷跟我说的。",
    "新来的hr长得好像那个网红。你注意到了吗？"
  ],
  lover:[
    "你今天……有点好看。",
    "周末有空吗？我知道一家不错的店。",
    "你最近老加班，别太累了。",
    "你是不是对我有什么想法？",
    "晚上要不要一起吃饭？我请客。",
    "你身上好香。换沐浴露了？",
    "我好像……有点喜欢上你了。"
  ]
};

function rp(pool){return pool[Math.floor(Math.random()*pool.length)]}

// ====== 场景 ======
var sn={};

sn.start={im:"🌃",t:"社畜生活 v3",d:"每次重玩都是全新的世界。\n所有的故事、对话、事件——全部随机生成，永不重复。\n\n先选一个角色：",ci:[
  {t:"👨 男生线 —— 社畜小哥+林小雅线",e:function(){D.sex="male"},g:"intro"},
  {t:"👩 女生线 —— 社畜妹子+神秘邻居线",e:function(){D.sex="female"},g:"intro"}
]};

sn.intro={im:D.sex==="male"?"👨‍💻":"👩‍💻",t:function(){return D.sex==="male"?"男生开局":"女生开局"},d:function(){
  if(D.sex==="male")return "你在这个城市第三个月，兜里一千块。\n\n邻居林小雅——舞蹈老师，晚上偶尔能听到她在家里练舞的声音。\n楼下阿强开了家便利店，什么八卦都瞒不过他。\n公司的周雨桐，长得好看，代码写得也不错。\n\n这就是你的世界了。";
  return "你在这个城市第一个月，租在老小区。\n\n隔壁男邻居帅得离谱，但神出鬼没。\n阿强天天八卦，说他见过这男的开跑车。\n公司有个帅同事叫陆远，对你挺照顾。\n\n这就是你的世界了。";
},ci:[
  {t:"🚶 开始新的一天",e:function(){},g:"newday"}
]};

sn.newday={im:"☀️",t:function(){return"第"+D.day+"天"},d:function(){
  var day=dailyLife();
  // 随机桃花事件
  if(Math.random()>0.6){
    D.lv+=Math.floor(Math.random()*8)+2;
    day+="\n\n💕 桃花信号："+rp(CHATS.lover);
  }
  // 随机加班扣hp
  if(Math.random()>0.7){
    D.hp-=Math.floor(Math.random()*8)+3;
    day+="\n\n😫 今天加班到很晚，累死了。";
  }else{
    D.hp+=Math.floor(Math.random()*5)+1;
  }
  // 随机收入
  D.mon+=Math.floor(Math.random()*15)+5;
  // 随机扣除
  if(Math.random()>0.6)D.mon-=Math.floor(Math.random()*30)+10;
  // 掉落物
  if(Math.random()>0.7){
    D.fl.rand=getItem();
    day+="\n\n🎁 你捡到了："+D.fl.rand;
  }
  return day;
},ci:[
  {t:"💬 跟同事聊天",e:function(){D.lv+=Math.floor(Math.random()*4)+1},g:"chat"},
  {t:"🌙 结束这一天",e:function(){D.day++;if(D.hp<20){go("go");return}},g:"night"},
  {t:"🔄 重开一局",e:function(){},g:"start"}
]};

sn.chat={im:"💬",t:"八卦时间",d:function(){
  var t=[];
  t.push(rp(CHATS.colleague));
  if(D.sex==="male")t.push("周雨桐今天穿了一条短裙。你多看了两眼。");
  else t.push("陆远今天穿了件白衬衫，袖子挽到手肘，挺帅。");
  if(Math.random()>0.5)t.push(rp(EVENTS.spicy));
  return t.join("\n\n");
},ci:[
  {t:"继续聊天",e:function(){D.lv+=Math.floor(Math.random()*3)+1},g:"chat"},
  {t:"回去工作",e:function(){},g:"newday"},
  {t:"下班回家",e:function(){D.day++;},g:"night"}
]};

sn.night={im:"🌙",t:function(){return"第"+D.day+"天 · 夜晚"},d:function(){
  var t=[];
  t.push(rp(EVENTS.night));
  if(Math.random()>0.5)t.push(rp(EVENTS.spicy));
  // 深夜邻居事件
  if(Math.random()>0.5){
    if(D.sex==="male")t.push("\n💕 隔壁传来音乐声和轻微的脚步声——林小雅在练舞。你忍不住想象了一下那个画面。");
    else t.push("\n💕 隔壁传来吉他声。歌声低沉温柔。你在窗边听了一会儿。");
    D.lv+=3;
  }
  return t.join("\n\n");
},ci:[
  {t:"😴 睡觉",e:function(){D.hp+=Math.floor(Math.random()*10)+5;},g:"newday"},
  {t:"📱 熬夜刷手机",e:function(){D.hp-=Math.floor(Math.random()*6)+2;D.lv+=Math.floor(Math.random()*3)+1},g:"phone"},
  {t:"🔄 重开",e:function(){},g:"start"}
]};

sn.phone={im:"📱",t:"深夜刷手机",d:function(){return rp([
  "刷到林小雅的抖音——一段现代舞，穿得很少。评论区快炸了。",
  "一个情感博主的视频：社畜的恋爱指南。你认真看完了。",
  "擦边直播间跳得正嗨。你心虚地看了一眼门口。",
  "你在社交软件上划到了一个很match的人。犹豫要不要右滑。",
  "看到一个帖子：你的邻居做过最让你心跳加速的事。评论区太精彩了。",
  "前任发了新动态——跟新欢在海边。你默默划走。",
  "舞蹈区UP主又更新了。你点了赞，收藏，然后陷入了贤者时间。"
]);},ci:[
  {t:"睡了",e:function(){D.day++;},g:"newday"}
]};

// 随机物品
function getItem(){
  return rp([
    "一张彩票（没中）","一张彩票（中了20块！）","一把雨伞","一枚硬币","半包纸巾",
    "一根充电线","一本旧书《如何征服美少女》","一张刮刮乐","地铁卡",
    "一盒未拆封的TT（？？？）","小林的发卡","一张酒吧名片"
  ]);
}

sn.go={im:"💀",t:"游戏结束",d:function(){
  if(D.hp<=0)return "你的身体扛不住了。在这个城市拼了"+D.day+"天后，终于倒下了。\n\n下次对自己好一点吧。\n\n存活天数："+D.day;
  return "你选择了离开这座城市。\n\n在这里的"+D.day+"天，有笑有泪。\n\n也许有一天还会回来。";
},ci:[
  {t:"🔄 重头再来",e:function(){},g:"start"}
]};

// ====== 启动 ======
init();go("start");
</script>
</body>
</html>

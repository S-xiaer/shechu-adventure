<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社畜生活 🏠</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:'Microsoft YaHei','PingFang SC',sans-serif;
    background:#1a1a2e; color:#e0e0e0;
    min-height:100vh; display:flex; justify-content:center; align-items:center;
}
#game {
    width:100%; max-width:720px; min-height:100vh;
    display:flex; flex-direction:column;
    background:#16213e; box-shadow:0 0 40px rgba(0,0,0,.5);
}
#header {
    background:linear-gradient(135deg,#0f3460,#1a1a2e);
    padding:14px 20px;
    border-bottom:2px solid #e94560;
    display:flex; justify-content:space-between; align-items:center;
    position:sticky; top:0; z-index:10;
}
#header h1 { font-size:17px; color:#e94560; font-weight:bold; }
#stats { display:flex; gap:10px; font-size:12px; }
.stat { padding:3px 10px; border-radius:12px; background:rgba(255,255,255,.08); }
.stat.money { color:#ffd700; }
.stat.hp { color:#4ecca3; }
.stat.love { color:#ff6b9d; }
#scene { flex:1; padding:20px; display:flex; flex-direction:column; gap:14px; overflow-y:auto; }
.scene-image { text-align:center; font-size:56px; margin:6px 0; }
.scene-title { font-size:20px; font-weight:bold; color:#fff; text-align:center; }
.scene-desc { line-height:1.8; font-size:15px; color:#c0c0c0; white-space:pre-wrap; }
.scene-desc .love-text { color:#ff6b9d; font-weight:bold; }
#choices { padding:14px 20px; display:flex; flex-direction:column; gap:8px; border-top:1px solid rgba(255,255,255,.06); background:rgba(0,0,0,.2); }
.choice-btn {
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    color:#e0e0e0; padding:12px 16px; border-radius:10px;
    font-size:14px; cursor:pointer; transition:all .2s;
    text-align:left; font-family:inherit; line-height:1.5;
}
.choice-btn:hover { background:rgba(233,69,96,.15); border-color:#e94560; transform:translateX(4px); }
.choice-btn .hotkey { display:inline-block; background:rgba(255,255,255,.1); padding:0 7px; border-radius:4px; margin-right:8px; font-size:12px; color:#888; }
#log { padding:10px 20px; font-size:12px; color:#666; border-top:1px solid rgba(255,255,255,.04); max-height:70px; overflow-y:auto; display:none; }
.log-entry { margin:2px 0; }
.log-entry .gain { color:#4ecca3; } .log-entry .lose { color:#e94560; }
#restart-btn { background:transparent; border:1px solid rgba(255,255,255,.15); color:#888; padding:4px 12px; border-radius:6px; font-size:12px; cursor:pointer; transition:all .2s; font-family:inherit; }
#restart-btn:hover { border-color:#e94560; color:#e94560; }
</style>
</head>
<body>
<div id="game">
    <div id="header">
        <h1>🏠 社畜生活</h1>
        <div id="stats">
            <span class="stat money">💰 <span id="money">0</span></span>
            <span class="stat hp">❤️ <span id="hp">0</span></span>
            <span class="stat love">💕 <span id="love">0</span></span>
        </div>
        <button id="restart-btn" onclick="restart()">↻</button>
    </div>
    <div id="scene"></div>
    <div id="choices"></div>
    <div id="log"></div>
</div>
<script>
// ========== 状态 ==========
var S = { money:1000, hp:100, love:50, sex:'', history:[], flags:{}, scene:'', day:1 };
function init() { S.money=1000; S.hp=100; S.love=50; S.sex=''; S.history=[]; S.flags={}; S.scene=''; S.day=1; }
function u() {
    document.getElementById('money').textContent = S.money>=10000?(S.money/10000).toFixed(1)+'w':S.money;
    document.getElementById('hp').textContent = S.hp;
    document.getElementById('love').textContent = S.love;
}
function tlog(text,type) { S.history.push({text:text,type:type}); }
function addMoney(a) { S.money+=a; if(a>0)tlog('💰 +'+a,'gain');else tlog('💰 '+a,'lose'); if(S.money<0)S.money=0; }
function addHP(a) { S.hp+=a; if(a>0)tlog('❤️ +'+a,'gain');else tlog('❤️ '+a,'lose'); if(S.hp<0)S.hp=0; if(S.hp>100)S.hp=100; }
function addLove(a) { S.love+=a; if(a>0)tlog('💕 +'+a,'gain');else tlog('💕 '+a,'lose'); if(S.love<0)S.love=0; if(S.love>100)S.love=100; }
function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

function go(id) { S.scene=id; render(); }

function render() {
    var sd = document.getElementById('scene');
    var cd = document.getElementById('choices');
    var ld = document.getElementById('log');
    var sc = scenes[S.scene];
    if(!sc) { sd.innerHTML='<div class="scene-title">场景丢失，点↻重启</div>'; cd.innerHTML=''; return; }
    if(sc.condition && !sc.condition()) { go(sc.fallback||'start'); return; }
    var desc = typeof sc.desc === 'function' ? sc.desc() : sc.desc;
    var title = typeof sc.title === 'function' ? sc.title() : sc.title;
    var h = '';
    if(sc.image) h += '<div class="scene-image">'+sc.image+'</div>';
    if(title) h += '<div class="scene-title">'+title+'</div>';
    if(desc) h += '<div class="scene-desc">'+(typeof desc==='string'?desc.replace(/\n/g,'<br>'):desc)+'</div>';
    sd.innerHTML = h;
    if(sc.choices) {
        cd.innerHTML = sc.choices.map(function(c,i){
            if(c.condition && !c.condition()) return '';
            var label = ['❶','❷','❸','❹','❺','❻','❼','❽'][i]||'#'+(i+1);
            return '<button class="choice-btn" onclick="choose('+i+')"><span class="hotkey">'+label+'</span>'+c.text+'</button>';
        }).join('');
    } else { cd.innerHTML=''; }
    if(S.history.length>0) {
        ld.style.display='block';
        var recent = S.history.slice(-4).reverse();
        ld.innerHTML = recent.map(function(h){ return '<div class="log-entry"><span class="'+(h.type==='gain'?'gain':h.type==='lose'?'lose':'')+'">'+h.text+'</span></div>'; }).join('');
    }
    u(); sd.scrollTop=0;
}

function choose(idx) {
    var sc = scenes[S.scene];
    if(!sc||!sc.choices||!sc.choices[idx]) return;
    var c = sc.choices[idx];
    if(c.effects) c.effects();
    if(c.goto) go(c.goto);
    if(S.hp<=0) setTimeout(function(){go('gameover');},500);
    u();
}
function restart() { if(!confirm('重新开始？进度消失')) return; init(); go('start'); }

// ========== RNG事件池 ==========

    function(){ return {d:'有人发传单——"男性专科医院"……赶紧揉成团扔掉。',hp:-5,lv:-3,m:0}; },
    function(){ return {d:'路边情侣在吵架，女的骂"你跟那个狐狸精聊了三个月！"你绕路。',hp:-3,lv:0,m:0}; },
    function(){ return {d:'流浪猫冲你喵喵叫，蹲下撸了一会儿。它蹭了蹭你的手。',hp:8,lv:3,m:-5}; },
    function(){ return {d:'林小雅从舞蹈工作室出来，穿着紧身运动服，头发湿漉漉的。她冲你点了下头。',hp:5,lv:8,m:0}; },
    function(){ return {d:'一个JK妹子做问卷，填完发现是成人用品调研……',hp:-2,lv:5,m:-10}; },
    function(){ return {d:'商场门口情侣接吻大赛，主持人喊"单身也能参加！"你低头快步走过。',hp:-5,lv:0,m:0}; }
];
var rngHome = [
    function(){ return {d:'洗完澡裹着浴巾发现忘拿睡衣。走廊有脚步声……',hp:-3,lv:5,m:0}; },
    function(){ return {d:'楼上古筝哥又开始了，这次是《忐忑》。',hp:-5,lv:-2,m:0}; },
    function(){ return {d:'外卖小哥是阿强——他白天看店晚上送外卖。"生活不易。"',hp:5,lv:3,m:-25}; },
    function(){ return {d:'正在换衣服突然有人敲门——林小雅："你有开瓶器吗？"',hp:5,lv:10,m:0}; },
    function(){ return {d:'刷到前任朋友圈——和新欢的合照。默默关掉手机。',hp:-10,lv:-5,m:0}; },
    function(){ return {d:'冰箱只剩过期牛奶和榨菜。今晚泡面。',hp:-5,lv:-3,m:-5}; },
    function(){ return {d:'正在看片耳机突然断连外放……隔壁传来敲墙声。',hp:-8,lv:3,m:0}; }
];
var rngRisky = [
    function(){ return {d:'林小雅微信："睡不着……你也没睡？"心跳加速。',hp:3,lv:12,m:0}; },
    function(){ return {d:'公司聚餐后，喝醉的女同事靠在你肩上，小声说"去你家还是我家？"',hp:5,lv:15,m:-50}; },
    function(){ return {d:'阿强神秘递来名片——洗浴中心，"楼上有特殊服务。"',hp:0,lv:5,m:-20}; },
    function(){ return {d:'深夜加班只剩你和周雨桐。她伸懒腰时T恤下摆露出一截小蛮腰。',hp:3,lv:10,m:0}; },
    function(){ return {d:'地铁刹车，一个穿短裙的妹子没站稳抓住了你的胳膊。',hp:2,lv:8,m:0}; },
    function(){ return {d:'偷偷打开成人网站，忘了删浏览记录……第二天同事借电脑。',hp:-8,lv:-5,m:-50}; },
    function(){ return {d:'林小雅穿着吊带睡裙来敲门，说热水器坏了想借浴室。',hp:3,lv:18,m:0}; }
];

function trigger(cat) {
    var pool = { office:rngOffice, street:rngStreet, home:rngHome, risky:rngRisky }[cat];
    if(!pool) return '';
    var evt = pick(pool)();
    addHP(evt.hp);
    addLove(evt.lv);
    addMoney(evt.m);
    return evt.d;
}

// ========== 场景 ==========
var scenes = {};

// ===== 开场 =====

    choices: [
        { text:'👨 我是男生', effects:function(){S.sex='male';}, goto:'intro_male' },
        { text:'👩 我是女生', effects:function(){S.sex='female';}, goto:'intro_female' }
    ]
};

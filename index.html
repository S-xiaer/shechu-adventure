<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社畜生存指南 🏠</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

#game {
    width: 100%;
    max-width: 700px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #16213e;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    position: relative;
}

#header {
    background: linear-gradient(135deg, #0f3460, #1a1a2e);
    padding: 16px 20px;
    border-bottom: 2px solid #e94560;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

#header h1 {
    font-size: 18px;
    color: #e94560;
    font-weight: bold;
}

#stats {
    display: flex;
    gap: 12px;
    font-size: 13px;
}

.stat {
    padding: 3px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
}

.stat.money { color: #ffd700; }
.stat.hp { color: #4ecca3; }
.stat.spirit { color: #e94560; }

#scene {
    flex: 1;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
}

.scene-image {
    text-align: center;
    font-size: 64px;
    margin: 8px 0;
    text-shadow: 0 0 20px rgba(233,69,96,0.3);
    animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

.scene-title {
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    text-align: center;
    margin-bottom: 4px;
}

.scene-desc {
    line-height: 1.8;
    font-size: 15px;
    color: #c0c0c0;
    white-space: pre-wrap;
}

.scene-desc .highlight { color: #4ecca3; font-weight: bold; }
.scene-desc .danger { color: #e94560; font-weight: bold; }
.scene-desc .item { color: #ffd700; }

#choices {
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.2);
}

.choice-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e0e0e0;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    font-family: inherit;
    line-height: 1.5;
}

.choice-btn:hover {
    background: rgba(233,69,96,0.15);
    border-color: #e94560;
    transform: translateX(4px);
}

.choice-btn:active { transform: translateX(2px); }

.choice-btn .hotkey {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    padding: 0 8px;
    border-radius: 4px;
    margin-right: 8px;
    font-size: 12px;
    color: #888;
}

#log {
    padding: 12px 20px;
    font-size: 12px;
    color: #666;
    border-top: 1px solid rgba(255,255,255,0.04);
    max-height: 80px;
    overflow-y: auto;
    display: none;
}

.log-entry { margin: 2px 0; }
.log-entry .action-gain { color: #4ecca3; }
.log-entry .action-lose { color: #e94560; }

#restart-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: #888;
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}

#restart-btn:hover { border-color: #e94560; color: #e94560; }
</style>
</head>
<body>
<div id="game">
    <div id="header">
        <h1>🏠 社畜生存指南</h1>
        <div id="stats">
            <span class="stat money">💰 <span id="money">0</span></span>
            <span class="stat hp">❤️ <span id="hp">0</span></span>
            <span class="stat spirit">🔥 <span id="spirit">0</span></span>
        </div>
        <button id="restart-btn" onclick="restart()">↻</button>
    </div>
    <div id="scene"></div>
    <div id="choices"></div>
    <div id="log"></div>
</div>
<script>
// 游戏状态
const state = { money: 1000, hp: 100, spirit: 80, flags: {}, scene: 'start', history: [] };
function initState() { state.money = 1000; state.hp = 100; state.spirit = 80; state.flags = {}; state.scene = 'start'; state.history = []; }

function updateUI() {
    document.getElementById('money').textContent = state.money >= 10000 ? (state.money/10000).toFixed(1)+'w' : state.money;
    document.getElementById('hp').textContent = state.hp;
    document.getElementById('spirit').textContent = state.spirit;
}
function addLog(text, type) { if (!state.history) state.history = []; state.history.push({text,type,money:state.money,hp:state.hp,spirit:state.spirit}); }
function changeMoney(a) { state.money += a; if(a>0)addLog('💰 +'+a,'gain');else addLog('💰 '+a,'lose'); if(state.money<0)state.money=0; }
function changeHP(a) { state.hp += a; if(a>0)addLog('❤️ +'+a,'gain');else addLog('❤️ '+a,'lose'); if(state.hp<0)state.hp=0; if(state.hp>100)state.hp=100; }
function changeSpirit(a) { state.spirit += a; if(a>0)addLog('🔥 +'+a,'gain');else addLog('🔥 '+a,'lose'); if(state.spirit<0)state.spirit=0; if(state.spirit>100)state.spirit=100; }

function goTo(id, delay) {
    if(delay>0) { setTimeout(function(){state.scene=id;render();},delay); }
    else { state.scene=id; render(); }
}

function render() {
    var s = document.getElementById('scene');
    var c = document.getElementById('choices');
    var l = document.getElementById('log');
    var scene = scenes[state.scene];
    if(!scene) { s.innerHTML = '<div class="scene-title">场景丢失</div>'; c.innerHTML=''; return; }
    if(scene.condition && !scene.condition()) { goTo(scene.fallback||'start'); return; }
    
    var desc = typeof scene.desc === 'function' ? scene.desc() : scene.desc;
    var html = '';
    if(scene.image) html += '<div class="scene-image">'+scene.image+'</div>';
    if(scene.title) html += '<div class="scene-title">'+scene.title+'</div>';
    if(desc) html += '<div class="scene-desc">'+desc.replace(/\n/g,'<br>')+'</div>';
    s.innerHTML = html;
    
    if(scene.choices) {
        c.innerHTML = scene.choices.map(function(choice,i){
            if(choice.condition && !choice.condition()) return '';
            var label = ['❶','❷','❸','❹','❺','❻','❼','❽'][i]||'#'+(i+1);
            return '<button class="choice-btn" onclick="choose('+i+')"><span class="hotkey">'+label+'</span>'+choice.text+'</button>';
        }).join('');
    } else { c.innerHTML = ''; }
    
    if(state.history && state.history.length>0) {
        l.style.display='block';
        var recent = state.history.slice(-5).reverse();
        l.innerHTML = recent.map(function(h){
            var cls = h.type==='gain'?'action-gain':h.type==='lose'?'action-lose':'';
            return '<div class="log-entry"><span class="'+cls+'">'+h.text+'</span></div>';
        }).join('');
    }
    updateUI();
}

function choose(idx) {
    var scene = scenes[state.scene];
    if(!scene||!scene.choices||!scene.choices[idx]) return;
    var choice = scene.choices[idx];
    if(choice.effects) choice.effects();
    if(choice.goto) goTo(choice.goto, choice.delay||0);
    if(state.hp<=0||state.spirit<=0) setTimeout(function(){goTo('gameover_dead');},500);
    updateUI();
}

function restart() { if(!confirm('重新开始？进度将丢失。')) return; initState(); render(); }

    choices: [
        { text: '赶紧出门，第一天不能迟到', effects: function(){state.flags.started=true;}, goto: 'office_morning' },

        { text: '偷偷再看一眼邻居小姐姐', effects: function(){changeSpirit(3);state.flags.started=true;state.flags.creepy=true;}, goto: 'office_morning' }
    ]
};

scenes.office_morning = {
    image: '🌅',
    title: '上班路上',
    desc: '你走出公寓大门，深吸了一口城市尾气的芬芳。\n\n楼下便利店门口，一个穿围裙的店员正在摆烟。他看到你，咧嘴一笑：\n"哟，新来的？住302那间？昨晚你搬家的动静可不小啊。"\n\n你尴尬地笑笑。这人看着二十七八，瘦高个，眼镜后面一双精明的眼睛。\n\n"我叫阿强，这片的万事通。有啥不懂的可以问我，一杯奶茶就行。"\n\n你看了看手机——还有20分钟打卡。',

    choices: [
        { text: '谢过阿强，赶紧跑路去公司', effects: function(){}, goto: 'office_arrive' },

scenes.ask_about_neighbor = {

    choices: [
        { text: '飞奔去公司！', effects: function(){}, goto: 'office_arrive' }

scenes.office_arrive = {

    title: '天祥科技',

scenes.ask_yutong_flower = {
